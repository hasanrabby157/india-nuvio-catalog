name: Test OTTweek Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          python scraper.py

      - name: Show catalogue
        run: |
          python - <<'PY'
          import json

          with open("catalogue.json", encoding="utf-8") as f:
              data = json.load(f)

          for language, info in data.items():
              print()
              print("=" * 40)
              print(language.upper())
              print("=" * 40)

              print("New Releases:", len(info["new_releases"]))
              print("New Movies:", len(info["new_movies"]))
              print("New Series:", len(info["new_series"]))
              print("Trending:", len(info["trending"]))
              print("Trending Movies:", len(info["trending_movies"]))
              print("Trending Series:", len(info["trending_series"]))

              print()
              print("Trending titles:")

              for item in info["trending"]:
                  print(
                      f"- {item['title']} | "
                      f"{item['type']} | "
                      f"{item['language']}"
                  )
          PY

      - name: Upload catalogue
        uses: actions/upload-artifact@v4
        with:
          name: ottweek-catalogue
          path: |
            catalogue.json
            trending.json
